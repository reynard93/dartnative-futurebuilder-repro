name: Publish compatible demo video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-demo-video.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Re-export for browser compatibility
        run: |
          set -euxo pipefail
          input='evidence/demo-ios-2026-09-23-h264.mp4'
          output='evidence/demo-ios-2026-09-23-compatible.mp4'
          ffmpeg -y -i "$input"             -map 0:v:0             -vf "scale=720:-2:flags=lanczos,fps=30"             -c:v libx264             -preset medium             -crf 20             -pix_fmt yuv420p             -profile:v main             -level 4.0             -tag:v avc1             -movflags +faststart             -brand mp42             -an             "$output"
          echo '--- FFPROBE ---'
          ffprobe -v error             -show_entries stream=codec_name,profile,level,pix_fmt,codec_tag_string,width,height,r_frame_rate,avg_frame_rate             -show_entries format=format_name,duration,size:format_tags=major_brand,compatible_brands             -of default=noprint_wrappers=1 "$output"
          echo '--- SAMPLE BRIGHTNESS ---'
          for t in 0 1 5 10 15 20 24; do
            printf 'TIME=%s Y=' "$t"
            ffmpeg -hide_banner -loglevel error -ss "$t" -i "$output"               -frames:v 1 -vf "scale=1:1:flags=area,format=gray"               -f rawvideo - 2>/dev/null | od -An -tu1 | tr -d ' \n'
            echo
          done
          rm "$input"
      - name: Publish replacement
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/demo-ios-2026-09-23-h264.mp4 evidence/demo-ios-2026-09-23-compatible.mp4
          git commit -m 'Re-export demo video for browser compatibility'
          git push
